<!doctype html><html lang="en-GB"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><title>AVERON — Administrator Sign In</title><link rel="icon" href="assets/favicon.png"><style>:root{--ink:#00293f;--gold:#a98b52;--card:#fffdf8;--line:#d9d2c4;--muted:#6d6a63}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--ink);font-family:Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);background:var(--card);padding:42px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}.brand img{width:48px;height:48px;object-fit:contain}.kicker{text-transform:uppercase;letter-spacing:.18em;font-size:10px;color:var(--gold);font-weight:700}.brand-name{font-family:Georgia,serif;font-size:24px;margin-top:4px}h1{font-family:Georgia,serif;font-weight:400;font-size:36px;margin:0 0 10px}p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin-bottom:15px}.password-wrap{position:relative}.password-wrap input{width:100%;border:1px solid var(--line);background:#fffdf8;color:var(--ink);padding:13px 14px;font:inherit;outline:none;color-scheme:light;-webkit-text-fill-color:var(--ink);caret-color:var(--ink)}.password-toggle{position:absolute;right:1px;top:1px;width:42px;height:calc(100% - 2px);padding:0;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}.password-toggle:hover,.password-toggle:focus{color:var(--ink);outline:none}.password-toggle svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.password-toggle .eye-open{display:none}.password-toggle[aria-pressed='true'] .eye-open{display:block}.password-toggle[aria-pressed='true'] .eye-closed{display:none}.field label{text-transform:uppercase;letter-spacing:.13em;font-size:9px;font-weight:700;color:var(--muted)}input{width:100%;border:1px solid var(--line);padding:13px 14px;font:inherit;outline:none}input:focus{border-color:var(--ink)}button{width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:13px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;cursor:pointer}button:disabled{opacity:.55}.error{min-height:18px;color:#8b3030;font-size:11px;margin-top:12px}.setup{display:none;border-left:2px solid var(--gold);padding-left:12px;margin-top:18px;font-size:11px;line-height:1.6;color:var(--muted)}
#admin-login-form input[type="email"],
#admin-login-form input[type="password"],
#admin-login-form input[type="text"]{
  width:100%;
  box-sizing:border-box;
  border:1px solid var(--line)!important;
  background:#fffdf8!important;
  background-color:#fffdf8!important;
  color:var(--ink)!important;
  -webkit-text-fill-color:var(--ink)!important;
  caret-color:var(--ink)!important;
  color-scheme:light!important;
}
#admin-login-form input:-webkit-autofill,
#admin-login-form input:-webkit-autofill:hover,
#admin-login-form input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 1000px #fffdf8 inset!important;
  box-shadow:0 0 0 1000px #fffdf8 inset!important;
  -webkit-text-fill-color:var(--ink)!important;
  caret-color:var(--ink)!important;
}
</style></head><body><main class="login"><div class="brand"><img src="assets/logo-navy.png" alt="AVERON"><div><div class="kicker">Private administration</div><div class="brand-name">AVERON</div></div></div><h1>Content Studio</h1><p>Sign in with your administrator credentials. This area is separate from the customer storefront.</p><form id="admin-login-form"><div class="field"><label for="admin-email">Administrator email</label><input id="admin-email" type="email" autocomplete="username" maxlength="160" required></div><div class="field"><label for="admin-password">Password</label><div class="password-wrap"><input id="admin-password" type="password" autocomplete="current-password" maxlength="256" required><button id="admin-password-toggle" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.7a2.8 2.8 0 0 0 3.8 3.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.1 0 9.5 7 9.5 7a16.2 16.2 0 0 1-2.6 3.6"/><path d="M6.2 6.3C3.8 8.1 2.5 12 2.5 12s3.4 7 9.5 7c1.8 0 3.4-.5 4.7-1.2"/></svg><svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button></div></div><button id="admin-submit">Sign In</button><div id="admin-error" class="error" role="alert"></div></form><div id="admin-setup" class="setup">Admin authentication is not configured yet. Follow ADMIN_AUTH_SETUP.md.</div></main><script src="admin-login.js"></script></body></html>
