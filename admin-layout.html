<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; media-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>AVERON — Site Text</title>
<link rel="icon" type="image/png" href="assets/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap"><link rel="stylesheet" href="styles.css">
<style>
:root{--admin-bg:#f4f1e9;--admin-card:#fffdf8;--admin-line:#d9d2c4;--admin-ink:#00293f;--admin-muted:#6d6a63;--admin-gold:#a98b52}
body{margin:0;background:var(--admin-bg);color:var(--admin-ink);font-family:Inter,Arial,sans-serif}.shell{max-width:1360px;margin:auto;padding:34px 28px 84px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:26px}.brand{display:flex;gap:14px;align-items:center}.brand img{width:46px;height:46px;object-fit:contain}.kicker{text-transform:uppercase;letter-spacing:.18em;font-size:10px;color:var(--admin-gold);font-weight:600}.title{font-family:Fraunces,serif;font-size:42px;line-height:1;margin-top:5px}.actions,.tabs,.filters{display:flex;gap:9px;flex-wrap:wrap}.btn,.tab{border:1px solid var(--admin-line);background:transparent;color:var(--admin-ink);padding:11px 15px;text-transform:uppercase;letter-spacing:.11em;font-size:10px;cursor:pointer;text-decoration:none}.btn.primary,.tab.active{background:var(--admin-ink);border-color:var(--admin-ink);color:white}.tabs{border-bottom:1px solid var(--admin-line);padding-bottom:10px;margin-bottom:22px}.tab{border:0}.intro{background:var(--admin-card);border:1px solid var(--admin-line);padding:20px;margin-bottom:16px}.intro h1{font-family:Fraunces,serif;font-size:28px;margin:0 0 8px}.intro p{font-size:12px;line-height:1.6;color:var(--admin-muted);margin:0}.filters{background:var(--admin-card);border:1px solid var(--admin-line);padding:14px;margin-bottom:16px}.filters input,.filters select{border:1px solid var(--admin-line);background:white;padding:11px 12px;color:var(--admin-ink);font:inherit;min-width:210px}.filters input{flex:1}.count{align-self:center;font-size:11px;color:var(--admin-muted)}.group{margin:14px 0;background:var(--admin-card);border:1px solid var(--admin-line)}.group-summary{width:100%;border:0;background:transparent;color:var(--admin-ink);padding:17px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left}.group-summary strong{font-family:Fraunces,serif;font-size:22px;font-weight:500}.group-summary span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--admin-muted)}.group-body{padding:0 14px 14px}.group.collapsed .group-body{display:none}.cards{display:grid;gap:10px}.card{background:var(--admin-card);border:1px solid var(--admin-line);padding:15px}.card-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}.card-head strong{font-family:Fraunces,serif;font-size:17px;font-weight:500}.meta{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--admin-muted);margin-top:4px}.text-field{display:grid;gap:6px}.text-field label,.control label{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--admin-muted);font-weight:600}.text-field textarea{width:100%;box-sizing:border-box;min-height:68px;resize:vertical;border:1px solid var(--admin-line);background:white;padding:10px 11px;color:var(--admin-ink);font:inherit}.statusbar{position:sticky;bottom:14px;background:rgba(255,253,248,.96);backdrop-filter:blur(10px);border:1px solid var(--admin-line);padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:20px}.status{font-size:11px;color:var(--admin-muted)}.empty{padding:30px;background:var(--admin-card);border:1px solid var(--admin-line);text-align:center;color:var(--admin-muted)}.toast{position:fixed;right:20px;bottom:20px;background:var(--admin-ink);color:#fff;padding:12px 16px;font-size:11px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
@media(max-width:760px){.shell{padding:22px 14px 70px}.top{align-items:flex-start;flex-direction:column}.title{font-size:34px}.tabs{overflow:auto;flex-wrap:nowrap}.tab{white-space:nowrap}.filters>*{width:100%;box-sizing:border-box}.statusbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="shell" id="layout-studio" hidden>
<header class="top"><div class="brand"><img src="assets/logo-navy.png" alt="AVERON"><div><div class="kicker">Private Area</div><div class="title">Content Studio</div></div></div><div class="actions"><a class="btn" href="index.html" target="_blank" rel="noopener">Open Storefront</a><button class="btn" id="logout">Sign Out</button></div></header>
<nav class="tabs" aria-label="Content Studio sections"><a class="tab" href="admin.html">Products & Banners</a><a class="tab active" href="admin-layout.html">Site Text</a></nav>
<section class="intro"><h1>Site Text</h1><p>Edit existing storefront copy without changing the typography or spacing. Mobile and desktop visual styling is controlled by the AVERON design system so the layout remains consistent.</p></section>
<div class="filters"><input id="layout-search" type="search" placeholder="Search text, page or section…"><select id="layout-page"><option value="all">All pages</option></select><span class="count" id="layout-count"></span></div>
<div id="layout-list"></div>
<div class="statusbar"><span class="status" id="layout-status">No unsaved text changes.</span><div class="actions"><button class="btn" id="reset-current" type="button">Restore visible defaults</button><button class="btn primary" id="save-layout" type="button">Save Site Text</button></div></div>
</div>
<div class="toast" id="toast"></div>
<script src="security.js"></script><script src="site-layout.registry.js"></script><script src="admin-layout.js"></script>
</body></html>
