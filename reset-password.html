<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Reset Password — AVERON</title>
<link rel="icon" href="assets/favicon.png">
<style>
:root{--ink:#00293f;--paper:#f3efe6;--card:#fffdf8;--line:#d9d2c4;--muted:#6d6a63}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}.reset-shell{width:min(470px,100%)}.brand{display:flex;justify-content:center;margin-bottom:28px}.brand img{width:min(180px,50vw);height:auto}.card{background:var(--card);border:1px solid var(--line);padding:42px 38px;box-shadow:0 22px 60px rgba(0,41,63,.08)}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:10px;font-weight:700;color:var(--muted)}h1{font-family:Georgia,serif;font-weight:400;font-size:34px;line-height:1.08;margin:8px 0 12px}p{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{text-transform:uppercase;letter-spacing:.13em;font-size:9px;font-weight:700;color:var(--muted)}input{width:100%;border:1px solid var(--line);background:#fffdf8;color:var(--ink);padding:13px 14px;font:inherit;outline:none}input:focus{border-color:var(--ink)}button,.button-link{display:block;width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:13px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.55}.secondary{margin-top:12px;background:transparent;color:var(--ink)}.message{min-height:18px;color:#8b3030;font-size:11px;line-height:1.5;margin-top:14px}.message.success{color:#315f42}.hidden{display:none!important}@media(max-width:520px){.card{padding:34px 24px}}
</style>
</head>
<body>
<main class="reset-shell">
  <a class="brand" href="index.html" aria-label="AVERON home"><img src="assets/logo-navy.png" alt="AVERON"></a>
  <section class="card">
    <span class="eyebrow">Private Client</span>
    <h1>Choose a new password</h1>
    <p id="reset-intro">Create a new password for your AVERON account.</p>
    <form id="reset-form" novalidate>
      <div class="field"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
      <div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></div>
      <button id="reset-submit" type="submit">Update password</button>
      <div id="reset-message" class="message" role="alert"></div>
    </form>
    <div id="reset-success" class="hidden">
      <p>Your password has been updated successfully. You can now sign in using your new password.</p>
      <a class="button-link" href="index.html?account=login">Sign in to AVERON</a>
    </div>
    <div id="reset-invalid" class="hidden">
      <p id="reset-invalid-copy">This password reset link is invalid or has expired.</p>
      <a class="button-link" href="index.html?account=login">Return to sign in</a>
    </div>
  </section>
</main>
<script src="reset-password.js"></script>
</body>
</html>
