<!DOCTYPE html>

<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<meta content="noindex,nofollow,noarchive" name="robots"/>
<meta content="no-referrer" name="referrer"/>
<title>Reset Password — AVERON</title>
<link href="assets/favicon.png" rel="icon"/>
<style>
:root{--ink:#00293f;--paper:#f3efe6;--card:#fffdf8;--line:#d9d2c4;--muted:#6d6a63}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);font-family:Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}.reset-shell{width:min(470px,100%)}.brand{display:flex;justify-content:center;margin-bottom:28px}.brand img{width:min(180px,50vw);height:auto}.card{background:var(--card);border:1px solid var(--line);padding:42px 38px;box-shadow:0 22px 60px rgba(0,41,63,.08)}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:10px;font-weight:700;color:var(--muted)}h1{font-family:Georgia,serif;font-weight:400;font-size:34px;line-height:1.08;margin:8px 0 12px}p{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{text-transform:uppercase;letter-spacing:.13em;font-size:9px;font-weight:700;color:var(--muted)}input{width:100%;border:1px solid var(--line);background:#fffdf8;color:var(--ink);padding:13px 14px;font:inherit;outline:none}input:focus{border-color:var(--ink)}button,.button-link{display:block;width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:13px 16px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.55}.secondary{margin-top:12px;background:transparent;color:var(--ink)}.message{min-height:18px;color:#8b3030;font-size:11px;line-height:1.5;margin-top:14px}.message.success{color:#315f42}.hidden{display:none!important}@media(max-width:520px){.card{padding:34px 24px}}
</style>
</head>
<body>
<main class="reset-shell">
<a aria-label="AVERON home" class="brand" href="index.html"><img alt="AVERON" src="assets/logo-navy.png"/></a>
<section class="card">
<span class="eyebrow" data-layout-id="reset-password-private-client">Private Client</span>
<h1 data-layout-id="reset-password-choose-a-new-password">Choose a new password</h1>
<p data-layout-id="reset-password-create-a-new-password-for-your-averon-acco" id="reset-intro">Create a new password for your AVERON account.</p>
<form id="reset-form" novalidate="">
<div class="field"><label data-layout-id="reset-password-new-password" for="new-password">New password</label><input autocomplete="new-password" id="new-password" maxlength="256" minlength="8" required="" type="password"/></div>
<div class="field"><label data-layout-id="reset-password-confirm-new-password" for="confirm-password">Confirm new password</label><input autocomplete="new-password" id="confirm-password" maxlength="256" minlength="8" required="" type="password"/></div>
<button data-layout-id="reset-password-update-password" id="reset-submit" type="submit">Update password</button>
<div class="message" id="reset-message" role="alert"></div>
</form>
<div class="hidden" id="reset-success">
<p data-layout-id="reset-password-your-password-has-been-updated-successfull">Your password has been updated successfully. You can now sign in using your new password.</p>
<a class="button-link" data-layout-id="reset-password-sign-in-to-averon" href="index.html?account=login">Sign in to AVERON</a>
</div>
<div class="hidden" id="reset-invalid">
<p data-layout-id="reset-password-this-password-reset-link-is-invalid-or-has" id="reset-invalid-copy">This password reset link is invalid or has expired.</p>
<a class="button-link" data-layout-id="reset-password-return-to-sign-in" href="index.html?account=login">Return to sign in</a>
</div>
</section>
</main>
<script src="reset-password.js"></script>
<script src="site-layout.js"></script>
</body>
</html>
